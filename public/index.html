<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>مادی‌بات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grain"></div>
    </div>

    <div class="app">
      <header class="topbar glass">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <defs>
                <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#7C3AED" />
                  <stop offset="1" stop-color="#0891B2" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)" />
              <path
                d="M9 20a7 7 0 0 1 14 0M10 16l1-2m5 2V9m5 7-1-2"
                stroke="#fff"
                stroke-width="1.8"
                stroke-linecap="round"
                fill="none"
              />
              <circle cx="12" cy="22" r="1.1" fill="#fff" />
              <circle cx="20" cy="22" r="1.1" fill="#fff" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>مادی‌بات</h1>
            <p id="headerSub">دستیار هوشمند</p>
          </div>
        </div>
        <div class="user-chip" id="userChip" title="کاربر">
          <span id="userInitial">؟</span>
        </div>
      </header>

      <main class="content">
        <!-- Dashboard -->
        <section id="view-dashboard" class="view active">
          <div class="hero glass">
            <h2 id="heroTitle">سلام! 👋</h2>
            <p id="heroSub">در حال بارگذاری…</p>
          </div>

          <div class="chips" id="statusChips"></div>

          <div class="actions">
            <button class="btn btn-primary" data-goto="chat">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              شروع گفتگو
            </button>
            <button class="btn" data-goto="games">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 11h4m-2-2v4M14 12h.01M18 12h.01M16.5 5.5 12 10l-4.5-4.5M12 10v8m0-3a4 4 0 0 1 8 0v1a4 4 0 0 1-8 0M12 10a4 4 0 0 0-8 0v1a4 4 0 0 0 8 0" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              بازی‌ها
            </button>
            <button class="btn" data-goto="image">
              <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><circle cx="9" cy="10" r="2" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="m5 18 5-5 3 3 3-3 3 3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              تصویر
            </button>
            <button class="btn" data-goto="tools">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L4 17l3 3 4.7-4.7a4.5 4.5 0 0 0 6-6L15 12l-3-3 2.7-2.7Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
              ابزارها
            </button>
          </div>
        </section>

        <!-- Chat -->
        <section id="view-chat" class="view">
          <div class="chat-scroll" id="chatScroll">
            <div id="messages" aria-live="polite"></div>
          </div>
          <div class="chat-input-bar glass">
            <input
              id="chatInput"
              type="text"
              placeholder="برای مادلین بنویس…"
              autocomplete="off"
              enterkeyhint="send"
            />
            <button id="sendBtn" class="send-btn" aria-label="ارسال">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 12 20 4l-5 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>

        <!-- Games -->
        <section id="view-games" class="view">
          <div class="section-head">
            <h2>🎮 بازی‌ها</h2>
            <span class="chip" id="gameCount">–</span>
          </div>
          <div class="game-grid" id="gameList"></div>
        </section>

        <!-- Image studio -->
        <section id="view-image" class="view">
          <div class="section-head">
            <h2>🖼 استودیوی تصویر</h2>
          </div>

          <div class="glass img-upload">
            <div class="img-upload-title">یک تصویر انتخاب کن</div>
            <div class="img-upload-actions">
              <button class="btn btn-primary" id="imgPickBtn">📤 از دستگاه</button>
              <input id="imgFile" type="file" accept="image/*" hidden />
              <button class="btn" id="imgSampleBtn">🧪 یک نمونه</button>
            </div>
            <div class="img-url-row">
              <input id="imgUrl" class="search-input" type="text" placeholder="یا آدرس اینترنتی تصویر را بچسبان…" />
              <button class="btn" id="imgUrlBtn">بارگذاری</button>
            </div>
          </div>

          <div class="img-preview hidden" id="imgPreview">
            <img id="imgView" alt="پیش‌نمایش" />
            <div class="img-meta-row">
              <span class="chip" id="imgMeta"></span>
              <button class="btn btn-small" id="imgDownload">⬇️ دانلود</button>
              <button class="btn btn-small" id="imgReset">🗑 حذف</button>
            </div>
          </div>

          <div class="img-actions hidden" id="imgActions">
            <div class="img-group">
              <div class="img-group-label">⚙️ ابزارهای محلی</div>
              <div class="chip-row" id="imgLocalChips"></div>
            </div>
            <div class="img-group">
              <div class="img-group-label">🤖 هوش مصنوعی</div>
              <div class="chip-row" id="imgAIChips"></div>
            </div>
            <div class="img-prompt-bar hidden" id="imgPromptBar">
              <input id="imgPrompt" class="search-input" type="text" placeholder="…" />
              <button class="btn btn-primary" id="imgPromptGo">اجرا</button>
              <button class="btn" id="imgPromptCancel">لغو</button>
            </div>
          </div>

          <div class="img-status" id="imgStatus"></div>
        </section>

        <!-- Tools hub -->
        <section id="view-tools" class="view">
          <div class="section-head">
            <h2>🧰 ابزارها</h2>
          </div>
          <div class="tool-nav" id="toolNav"></div>
          <div class="tool-panel" id="toolPanel"></div>
        </section>
      </main>

      <nav class="tabbar glass">
        <button class="tab active" data-view="dashboard">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 4h7v7H3zM14 4h7v4h-7zM14 10h7v10h-7zM3 13h7v7H3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/></svg>
          <span>خانه</span>
        </button>
        <button class="tab" data-view="chat">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>گفتگو</span>
        </button>
        <button class="tab" data-view="games">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M6 11h4m-2-2v4M14 12h.01M18 12h.01M16.5 5.5 12 10l-4.5-4.5M12 10v8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>بازی‌ها</span>
        </button>
        <button class="tab" data-view="image">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="9" cy="10" r="2" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="m5 18 5-5 3 3 3-3 3 3" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>تصویر</span>
        </button>
        <button class="tab" data-view="tools">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M14.7 6.3a4.5 4.5 0 0 0-6 6L4 17l3 3 4.7-4.7a4.5 4.5 0 0 0 6-6L15 12l-3-3 2.7-2.7Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linejoin="round"/></svg>
          <span>ابزارها</span>
        </button>
      </nav>

      <div id="toast" class="toast" role="status"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
