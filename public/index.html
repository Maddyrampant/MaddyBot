<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0a0f" />
    <title>مادی‌بات</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div class="bg" aria-hidden="true">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="grain"></div>
    </div>

    <div class="app">
      <header class="topbar glass">
        <div class="brand">
          <div class="logo" aria-hidden="true">
            <svg viewBox="0 0 32 32" width="34" height="34">
              <defs>
                <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#7C3AED" />
                  <stop offset="1" stop-color="#0891B2" />
                </linearGradient>
              </defs>
              <rect x="1" y="1" width="30" height="30" rx="9" fill="url(#lg)" />
              <path
                d="M9 20a7 7 0 0 1 14 0M10 16l1-2m5 2V9m5 7-1-2"
                stroke="#fff"
                stroke-width="1.8"
                stroke-linecap="round"
                fill="none"
              />
              <circle cx="12" cy="22" r="1.1" fill="#fff" />
              <circle cx="20" cy="22" r="1.1" fill="#fff" />
            </svg>
          </div>
          <div class="brand-text">
            <h1>مادی‌بات</h1>
            <p id="headerSub">دستیار هوشمند</p>
          </div>
        </div>
        <div class="user-chip" id="userChip" title="کاربر">
          <span id="userInitial">؟</span>
        </div>
      </header>

      <main class="content">
        <!-- Dashboard -->
        <section id="view-dashboard" class="view active">
          <div class="hero glass">
            <h2 id="heroTitle">سلام! 👋</h2>
            <p id="heroSub">در حال بارگذاری…</p>
          </div>

          <div class="chips" id="statusChips"></div>

          <div class="actions">
            <button class="btn btn-primary" data-goto="chat">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              شروع گفتگو
            </button>
            <button class="btn" data-goto="memories">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v13m0-13a6 6 0 0 1 6 6M12 3a6 6 0 0 0-6 6M4 20h16" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
              خاطرات من
            </button>
            <button class="btn" data-goto="commands">
              <svg viewBox="0 0 24 24" width="20" height="20"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
              همه فرمان‌ها
            </button>
          </div>
        </section>

        <!-- Chat -->
        <section id="view-chat" class="view">
          <div class="chat-scroll" id="chatScroll">
            <div id="messages" aria-live="polite"></div>
          </div>
          <div class="chat-input-bar glass">
            <input
              id="chatInput"
              type="text"
              placeholder="برای مادلین بنویس…"
              autocomplete="off"
              enterkeyhint="send"
            />
            <button id="sendBtn" class="send-btn" aria-label="ارسال">
              <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 12 20 4l-5 16-3-7-7-1Z" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linejoin="round"/></svg>
            </button>
          </div>
        </section>

        <!-- Memories -->
        <section id="view-memories" class="view">
          <div class="section-head">
            <h2>🧠 خاطرات من</h2>
            <button class="icon-btn" id="memRefresh" aria-label="به‌روزرسانی">
              <svg viewBox="0 0 24 24" width="20" height="20"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v4h-4" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <p class="muted" id="memEmpty">خاطره‌ای ثبت نشده. با مادلین چت کن تا کم‌کم شما را بشناسد.</p>
          <div id="memList"></div>
        </section>

        <!-- Commands -->
        <section id="view-commands" class="view">
          <div class="section-head">
            <h2>📋 فرمان‌ها</h2>
            <span class="chip" id="cmdCount">–</span>
          </div>
          <input id="cmdSearch" class="search-input" type="search" placeholder="جستجوی فرمان…" />
          <div id="cmdList"></div>
        </section>
      </main>

      <nav class="tabbar glass">
        <button class="tab active" data-view="dashboard">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M3 4h7v7H3zM14 4h7v4h-7zM14 10h7v10h-7zM3 13h7v7H3z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" fill="none"/></svg>
          <span>خانه</span>
        </button>
        <button class="tab" data-view="chat">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.4-.7L3 21l1.8-5.6A8.4 8.4 0 1 1 21 11.5Z" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>گفتگو</span>
        </button>
        <button class="tab" data-view="memories">
          <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 3v13m0-13a6 6 0 0 1 6 6M12 3a6 6 0 0 0-6 6M4 20h16" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>حافظه</span>
        </button>
        <button class="tab" data-view="commands">
          <svg viewBox="0 0 24 24" width="22" height="22"><rect x="3" y="4" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.7" fill="none"/><path d="M8 10h8M8 14h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span>فرمان‌ها</span>
        </button>
      </nav>

      <div id="toast" class="toast" role="status"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
