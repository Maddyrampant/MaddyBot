<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🔨 Whack-a-Mole</title>
<script src="/games/sdk.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, Tahoma, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2740 0%, #0c1120 70%); color: #e8edf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  .hud { display: flex; gap: 16px; justify-content: center; margin: 12px 0; }
  .pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 18px; font-size: 15px; font-weight: 700; }
  .pill b { color: #ffd166; }
  #field { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; width: min(92vw, 340px); }
  .hole { aspect-ratio: 1; border-radius: 18px; background: #1c2742; border: 2px solid rgba(255,255,255,.1); display: flex; align-items: center; justify-content: center; font-size: 52px; cursor: pointer; overflow: hidden; position: relative; }
  .hole .mole { transform: translateY(120%); transition: transform .12s; }
  .hole.show .mole { transform: translateY(0); animation: bump .18s; }
  .hole.bomb .mole { animation: shake .2s; }
  @keyframes bump { 0% { transform: translateY(60%) scale(1.2); } 100% { transform: translateY(0) scale(1); } }
  @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
  .hint { margin-top: 12px; font-size: 12px; color: #8b97ad; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,20,.86); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 26px; color: #ffd166; }
  #overlay .score { font-size: 40px; font-weight: 900; }
  #overlay .board { width: min(90vw, 360px); background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px; }
  #overlay .row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
  #overlay .row.me { color: #ffd166; font-weight: 700; }
  button.play { margin-top: 6px; padding: 12px 42px; font-size: 18px; font-weight: 800; border: none; border-radius: 999px; background: linear-gradient(135deg, #ffd166, #f77f00); color: #10141f; cursor: pointer; }
</style>
</head>
<body>
  <div class="hud">
    <div class="pill">⏱️ <b id="time">30</b>s</div>
    <div class="pill">امتیاز <b id="score">0</b></div>
  </div>
  <div id="field"></div>
  <div class="hint">🐹 موش‌ها را بزن — از 💣 بمب دوری کن!</div>

  <div id="overlay">
    <h2>⏰ وقت تمام شد!</h2>
    <div class="score" id="oScore">0</div>
    <div class="board" id="boardTop"></div>
    <button class="play" id="replay">🔁 بازی دوباره</button>
  </div>

<script>
"use strict";
const KEY = "whack";
const TIME = 30;
const fieldEl = document.getElementById("field");
let score, seconds, over, spawnTimer, tickTimer;
let holes = [];

function reset() {
  score = 0; seconds = TIME; over = false;
  holes = [];
  document.getElementById("score").textContent = 0;
  document.getElementById("time").textContent = TIME;
  build();
  document.getElementById("overlay").classList.remove("show");
  clearInterval(spawnTimer); clearInterval(tickTimer);
  tickTimer = setInterval(() => {
    seconds--;
    document.getElementById("time").textContent = seconds;
    if (seconds <= 0) end();
  }, 1000);
  spawnTimer = setInterval(spawnMole, 650);
}

function build() {
  fieldEl.innerHTML = "";
  for (let i = 0; i < 9; i++) {
    const d = document.createElement("div");
    d.className = "hole";
    d.innerHTML = '<span class="mole">🐹</span>';
    d.addEventListener("click", () => hit(i));
    fieldEl.appendChild(d);
    holes.push(d);
  }
}

function spawnMole() {
  if (over) return;
  let free = holes.filter(h => !h.classList.contains("show") && !h.classList.contains("bomb"));
  if (!free.length) return;
  const h = free[Math.floor(Math.random() * free.length)];
  h.classList.remove("bomb");
  h.classList.add("show");
  const isBomb = Math.random() < .15;
  if (isBomb) { h.querySelector(".mole").textContent = "💣"; h.classList.add("bomb"); }
  else h.querySelector(".mole").textContent = "🐹";
  setTimeout(() => { h.classList.remove("show", "bomb"); }, 900);
}

function hit(i) {
  const h = holes[i];
  if (!h.classList.contains("show")) return;
  if (h.classList.contains("bomb")) {
    score = Math.max(0, score - 3);
    h.classList.remove("show", "bomb");
    return;
  }
  score++;
  document.getElementById("score").textContent = score;
  h.classList.remove("show");
}

async function end() {
  if (over) return;
  over = true;
  clearInterval(spawnTimer); clearInterval(tickTimer);
  document.getElementById("oScore").textContent = score;
  const res = await GameSDK.submit(KEY, score);
  const top = res.top || [];
  const el = document.getElementById("boardTop");
  if (top.length) {
    el.innerHTML = "<div class='row' style='color:#8b97ad'><span>رتبه</span><span>بازیکن</span><span>امتیاز</span></div>" +
      top.map(t => `<div class="row${String(t.id) === String(GameSDK.userId) ? " me" : ""}"><span>${t.rank}.</span><span>${(t.name || "کاربر")}</span><span>${t.score}</span></div>`).join("");
  } else el.innerHTML = "<div class='row' style='justify-content:center;color:#8b97ad'>برد ثبت نشد</div>";
  document.getElementById("overlay").classList.add("show");
}

document.getElementById("replay").addEventListener("click", reset);
GameSDK.expand();
reset();
</script>
</body>
</html>
