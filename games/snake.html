<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐍 Snake</title>
<script src="/games/sdk.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, Tahoma, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2740 0%, #0c1120 70%); color: #e8edf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  .hud { display: flex; gap: 16px; justify-content: center; align-items: center; margin: 12px 0 10px; width: 100%; }
  .pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 18px; font-size: 15px; font-weight: 700; }
  .pill b { color: #ffd166; font-size: 17px; }
  canvas { background: #0d1526; border: 2px solid rgba(255,255,255,.14); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); touch-action: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; margin-top: 14px; }
  .dpad button { font-size: 22px; border: none; border-radius: 14px; background: rgba(255,255,255,.08); color: #fff; cursor: pointer; }
  .dpad button:active { background: rgba(255,255,255,.22); }
  .dpad .empty { background: transparent; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,20,.86); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 26px; color: #ffd166; }
  #overlay .score { font-size: 40px; font-weight: 900; }
  #overlay .board { width: min(90vw, 360px); background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px; }
  #overlay .row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
  #overlay .row.me { color: #ffd166; font-weight: 700; }
  button.play { margin-top: 6px; padding: 12px 42px; font-size: 18px; font-weight: 800; border: none; border-radius: 999px; background: linear-gradient(135deg, #ffd166, #f77f00); color: #10141f; cursor: pointer; }
  button.play:active { transform: scale(.96); }
  .hint { margin-top: 10px; font-size: 12px; color: #8b97ad; }
</style>
</head>
<body>
  <div class="hud">
    <div class="pill">امتیاز <b id="score">0</b></div>
    <div class="pill">بهترین <b id="best">0</b></div>
  </div>
  <canvas id="c" width="400" height="400"></canvas>
  <div class="dpad">
    <div class="empty"></div><button data-d="up">⬆️</button><div class="empty"></div>
    <button data-d="left">⬅️</button><div class="empty"></div><button data-d="right">➡️</button>
    <div class="empty"></div><button data-d="down">⬇️</button><div class="empty"></div>
  </div>
  <div class="hint">کلیدهای جهت‌دار یا سوییپ هم کار می‌کند</div>

  <div id="overlay">
    <h2>🐍 بازی تمام شد!</h2>
    <div class="score" id="oScore">0</div>
    <div class="board" id="board"></div>
    <button class="play" id="replay">🔁 بازی دوباره</button>
  </div>

<script>
"use strict";
const KEY = "snake";
const N = 20;
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const size = Math.min(window.innerWidth - 24, 400);
canvas.width = size; canvas.height = size;
const cell = size / N;

let snake, dir, nextDir, food, score, best, alive, speed, timer;

function reset() {
  snake = [{ x: 10, y: 10 }];
  dir = { x: 1, y: 0 }; nextDir = dir;
  score = 0;
  best = GameSDK.localBest(KEY) || 0;
  alive = true;
  speed = 150;
  placeFood();
  updateHud();
  document.getElementById("overlay").classList.remove("show");
  clearInterval(timer);
  timer = setInterval(step, speed);
  draw();
}

function placeFood() {
  while (true) {
    const f = { x: Math.floor(Math.random() * N), y: Math.floor(Math.random() * N) };
    if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
  }
}

function step() {
  if (!alive) return;
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
  if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N || snake.some(s => s.x === head.x && s.y === head.y)) {
    return gameOver();
  }
  snake.unshift(head);
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    best = Math.max(best, score);
    updateHud();
    placeFood();
    if (speed > 70) { speed -= 4; clearInterval(timer); timer = setInterval(step, speed); }
  } else {
    snake.pop();
  }
  draw();
}

function draw() {
  ctx.fillStyle = "#0d1526"; ctx.fillRect(0, 0, size, size);
  ctx.strokeStyle = "rgba(255,255,255,.04)"; ctx.lineWidth = 1;
  for (let i = 0; i <= N; i++) {
    ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, size); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(size, i * cell); ctx.stroke();
  }
  ctx.fillStyle = "#ffd166"; ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(food.x * cell + cell / 2, food.y * cell + cell / 2, cell * .34, 0, Math.PI * 2); ctx.fill();
  ctx.shadowBlur = 0;
  snake.forEach((s, i) => {
    ctx.fillStyle = i === 0 ? "#3ee08a" : "#2a9d68";
    ctx.shadowColor = "#3ee08a"; ctx.shadowBlur = i === 0 ? 8 : 0;
    ctx.fillRect(s.x * cell + 1, s.y * cell + 1, cell - 2, cell - 2);
  });
  ctx.shadowBlur = 0;
}

function updateHud() {
  document.getElementById("score").textContent = score;
  document.getElementById("best").textContent = Math.max(best, GameSDK.localBest(KEY));
}

async function gameOver() {
  alive = false;
  clearInterval(timer);
  GameSDK.saveLocalBest(KEY, score);
  document.getElementById("oScore").textContent = score;
  const res = await GameSDK.submit(KEY, score);
  const top = res.top || [];
  const board = document.getElementById("board");
  if (top.length) {
    board.innerHTML = "<div class='row' style='color:#8b97ad'><span>رتبه</span><span>بازیکن</span><span>امتیاز</span></div>" +
      top.map(t => `<div class="row${String(t.id) === String(GameSDK.userId) ? " me" : ""}"><span>${t.rank}.</span><span>${(t.name || "کاربر")}</span><span>${t.score}</span></div>`).join("");
  } else {
    board.innerHTML = "<div class='row' style='justify-content:center;color:#8b97ad'>برد بدون ثبت (بریم ببینیم!)</div>";
  }
  document.getElementById("overlay").classList.add("show");
  draw();
}

function turn(d) {
  if (d === "up" && dir.y !== 1) nextDir = { x: 0, y: -1 };
  if (d === "down" && dir.y !== -1) nextDir = { x: 0, y: 1 };
  if (d === "left" && dir.x !== 1) nextDir = { x: -1, y: 0 };
  if (d === "right" && dir.x !== -1) nextDir = { x: 1, y: 0 };
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowup" || k === "w") turn("up");
  if (k === "arrowdown" || k === "s") turn("down");
  if (k === "arrowleft" || k === "a") turn("left");
  if (k === "arrowright" || k === "d") turn("right");
  if ((k === "arrowup" || k === "arrowdown" || k === "arrowleft" || k === "arrowright")) e.preventDefault();
});

let sx = 0, sy = 0;
canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
canvas.addEventListener("touchend", e => {
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
  if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? "right" : "left");
  else turn(dy > 0 ? "down" : "up");
}, { passive: true });

document.querySelectorAll(".dpad button[data-d]").forEach(b => b.addEventListener("click", () => turn(b.dataset.d)));
document.getElementById("replay").addEventListener("click", reset);

GameSDK.expand();
reset();
</script>
</body>
</html>
