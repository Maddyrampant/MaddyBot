<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🧱 Breakout</title>
<script src="/games/sdk.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, Tahoma, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2740 0%, #0c1120 70%); color: #e8edf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  .hud { display: flex; gap: 16px; justify-content: center; margin: 12px 0; }
  .pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 18px; font-size: 15px; font-weight: 700; }
  .pill b { color: #ffd166; }
  canvas { background: #0d1526; border: 2px solid rgba(255,255,255,.14); border-radius: 14px; box-shadow: 0 10px 30px rgba(0,0,0,.5); touch-action: none; width: min(94vw, 460px); }
  .hint { margin-top: 12px; font-size: 12px; color: #8b97ad; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,20,.86); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 26px; color: #ffd166; }
  #overlay .score { font-size: 40px; font-weight: 900; }
  #overlay .board { width: min(90vw, 360px); background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px; }
  #overlay .row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
  #overlay .row.me { color: #ffd166; font-weight: 700; }
  button.play { margin-top: 6px; padding: 12px 42px; font-size: 18px; font-weight: 800; border: none; border-radius: 999px; background: linear-gradient(135deg, #ffd166, #f77f00); color: #10141f; cursor: pointer; }
</style>
</head>
<body>
  <div class="hud">
    <div class="pill">امتیاز <b id="score">0</b></div>
    <div class="pill">جان <b id="lives">3</b></div>
    <div class="pill">مرحله <b id="level">1</b></div>
  </div>
  <canvas id="c"></canvas>
  <div class="hint">🖱️ ماوس/لمس برای حرکت خفاش — کلیدهای ← → هم کار می‌کند</div>

  <div id="overlay">
    <h2 id="oTitle">🧱 تمام شد!</h2>
    <div class="score" id="oScore">0</div>
    <div class="board" id="boardTop"></div>
    <button class="play" id="replay">🔁 بازی دوباره</button>
  </div>

<script>
"use strict";
const KEY = "breakout";
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const W = 460, H = 320;
canvas.width = W; canvas.height = H;
const ROWS = 5, COLS = 8;
const COLORS = ["#ff6b6b", "#f7a33c", "#ffd166", "#3ee08a", "#4db8ff"];

let paddle, ball, bricks, score, lives, level, over, anim, waiting;

function buildLevel() {
  bricks = [];
  const bw = (W - 40) / COLS, bh = 18;
  for (let r = 0; r < ROWS; r++)
    for (let c = 0; c < COLS; c++)
      bricks.push({ x: 20 + c * bw, y: 40 + r * bh + r * 4, w: bw - 4, h: bh, color: COLORS[(r + level - 1) % COLORS.length] });
}

function reset() {
  paddle = { x: W / 2 - 50, y: H - 30, w: 100, h: 12 };
  score = 0; lives = 3; level = 1; over = false;
  buildLevel();
  serve();
  document.getElementById("overlay").classList.remove("show");
  cancelAnimationFrame(anim);
  loop();
}

function serve() {
  ball = { x: paddle.x + paddle.w / 2, y: paddle.y - 8, vx: 3 * (Math.random() < .5 ? 1 : -1), vy: -4, r: 7 };
  waiting = true;
}

function draw() {
  ctx.fillStyle = "#0d1526"; ctx.fillRect(0, 0, W, H);
  bricks.forEach(b => {
    ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h);
  });
  ctx.fillStyle = "#e8edf5"; ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);
  ctx.fillStyle = "#ffd166"; ctx.shadowColor = "#ffd166"; ctx.shadowBlur = 10;
  ctx.beginPath(); ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2); ctx.fill(); ctx.shadowBlur = 0;
}

function update() {
  if (over) return;
  if (waiting) {
    ball.x = paddle.x + paddle.w / 2;
    if (keys.left) paddle.x -= 6;
    if (keys.right) paddle.x += 6;
    paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));
    return;
  }
  if (keys.left) paddle.x -= 6;
  if (keys.right) paddle.x += 6;
  paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));

  ball.x += ball.vx; ball.y += ball.vy;
  if (ball.x < ball.r || ball.x > W - ball.r) ball.vx *= -1;
  if (ball.y < ball.r) ball.vy *= -1;

  if (ball.y > paddle.y && ball.y < paddle.y + paddle.h + 6 && ball.x > paddle.x - ball.r && ball.x < paddle.x + paddle.w + ball.r && ball.vy > 0) {
    const hit = (ball.x - paddle.x) / paddle.w - .5;
    ball.vy = -Math.abs(ball.vy);
    ball.vx = hit * 5;
    ball.vx = Math.max(-7, Math.min(7, ball.vx));
  }

  for (let i = bricks.length - 1; i >= 0; i--) {
    const b = bricks[i];
    if (ball.x + ball.r > b.x && ball.x - ball.r < b.x + b.w && ball.y + ball.r > b.y && ball.y - ball.r < b.y + b.h) {
      bricks.splice(i, 1);
      score += 10 * level;
      ball.vy *= -1;
      document.getElementById("score").textContent = score;
    }
  }

  if (!bricks.length) {
    level++;
    document.getElementById("level").textContent = level;
    buildLevel();
    serve();
  }

  if (ball.y > H + 20) {
    lives--;
    document.getElementById("lives").textContent = lives;
    if (lives <= 0) return gameOver();
    serve();
  }
}

const keys = { left: false, right: false };
function loop() {
  update(); draw();
  anim = requestAnimationFrame(loop);
}

window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = true;
  if (k === "arrowright" || k === "d") keys.right = true;
  if (k.startsWith("arrow")) e.preventDefault();
  if (k === " " && over) reset();
  if (k === " " && waiting) waiting = false;
});
window.addEventListener("keyup", e => {
  const k = e.key.toLowerCase();
  if (k === "arrowleft" || k === "a") keys.left = false;
  if (k === "arrowright" || k === "d") keys.right = false;
});

canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  paddle.x = (e.clientX - r.left) * (W / r.width) - paddle.w / 2;
  paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));
});
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  const t = e.touches[0];
  const r = canvas.getBoundingClientRect();
  paddle.x = (t.clientX - r.left) * (W / r.width) - paddle.w / 2;
  paddle.x = Math.max(8, Math.min(W - paddle.w - 8, paddle.x));
}, { passive: false });
canvas.addEventListener("click", () => { if (waiting) waiting = false; });

async function gameOver() {
  over = true;
  document.getElementById("oTitle").textContent = "🧱 تمام شد!";
  document.getElementById("oScore").textContent = score;
  const res = await GameSDK.submit(KEY, score);
  const top = res.top || [];
  const el = document.getElementById("boardTop");
  if (top.length) {
    el.innerHTML = "<div class='row' style='color:#8b97ad'><span>رتبه</span><span>بازیکن</span><span>امتیاز</span></div>" +
      top.map(t => `<div class="row${String(t.id) === String(GameSDK.userId) ? " me" : ""}"><span>${t.rank}.</span><span>${(t.name || "کاربر")}</span><span>${t.score}</span></div>`).join("");
  } else el.innerHTML = "<div class='row' style='justify-content:center;color:#8b97ad'>برد ثبت نشد</div>";
  document.getElementById("overlay").classList.add("show");
}

document.getElementById("replay").addEventListener("click", reset);
GameSDK.expand();
reset();
</script>
</body>
</html>
