<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎮 HTML5 Games</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: system-ui, Tahoma, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2740 0%, #0c1120 70%); color: #e8edf5; min-height: 100vh; padding: 24px 16px; }
  h1 { text-align: center; margin-bottom: 20px; font-size: 24px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; max-width: 760px; margin: 0 auto; }
  a { display: flex; flex-direction: column; align-items: center; gap: 8px; text-decoration: none; color: #e8edf5; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.12); border-radius: 16px; padding: 18px 10px; font-weight: 700; font-size: 14px; transition: transform .12s, background .12s; }
  a:hover { transform: translateY(-3px); background: rgba(255,255,255,.13); }
  a .e { font-size: 40px; }
  .note { text-align: center; margin-top: 20px; font-size: 12px; color: #8b97ad; }
</style>
</head>
<body>
  <h1>🎮 بازی‌های مادی‌بات</h1>
  <div class="grid" id="g"></div>
  <div class="note">امتیازها فقط از داخل تلگرام ثبت می‌شوند.</div>
<script>
const GAMES = [
  ["🐍", "Snake", "snake.html"],
  ["🎲", "2048", "twenty48.html"],
  ["🏓", "Pong", "pong.html"],
  ["🧱", "Breakout", "breakout.html"],
  ["🃏", "Memory", "memory.html"],
  ["💣", "Minesweeper", "mines.html"],
  ["🔴", "Simon", "simon.html"],
  ["🧩", "Tetris", "tetris.html"],
  ["🔨", "Whack-a-Mole", "whack.html"],
  ["🐦", "Flappy", "flappy.html"],
];
const g = document.getElementById("g");
GAMES.forEach(([e, n, f]) => {
  const a = document.createElement("a");
  a.href = f;
  a.innerHTML = '<span class="e">' + e + "</span>" + n;
  g.appendChild(a);
});
</script>
</body>
</html>
