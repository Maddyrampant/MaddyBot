<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>💣 Minesweeper</title>
<script src="/games/sdk.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { font-family: system-ui, Tahoma, Arial, sans-serif; background: radial-gradient(circle at 50% 0%, #1b2740 0%, #0c1120 70%); color: #e8edf5; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; user-select: none; }
  .hud { display: flex; gap: 16px; justify-content: center; margin: 12px 0; }
  .pill { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 999px; padding: 6px 18px; font-size: 15px; font-weight: 700; }
  .pill b { color: #ffd166; }
  #grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; width: min(92vw, 350px); }
  .cell { aspect-ratio: 1; border-radius: 6px; background: #3a5a78; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 800; cursor: pointer; border: 1px solid rgba(255,255,255,.12); }
  .cell.open { background: rgba(255,255,255,.07); border-color: transparent; }
  .cell.flag { background: #7a5fd0; color: #fff; }
  .cell.bomb { background: #ff6b6b; }
  .n1 { color: #4db8ff; } .n2 { color: #3ee08a; } .n3 { color: #ff6b6b; } .n4 { color: #c05fc0; }
  .n5 { color: #f7a33c; } .n6 { color: #4db8ff; } .n7 { color: #ffd166; } .n8 { color: #ff6b6b; }
  button.flagbtn { margin-top: 10px; padding: 8px 24px; border: none; border-radius: 999px; background: rgba(255,255,255,.1); color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; }
  button.flagbtn.on { background: #7a5fd0; }
  .hint { margin-top: 10px; font-size: 12px; color: #8b97ad; }
  #overlay { position: fixed; inset: 0; background: rgba(6,10,20,.86); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; z-index: 10; }
  #overlay.show { display: flex; }
  #overlay h2 { font-size: 26px; color: #ffd166; }
  #overlay .score { font-size: 40px; font-weight: 900; }
  #overlay .board { width: min(90vw, 360px); background: rgba(255,255,255,.06); border-radius: 14px; padding: 10px; }
  #overlay .row { display: flex; justify-content: space-between; padding: 4px 8px; font-size: 14px; }
  #overlay .row.me { color: #ffd166; font-weight: 700; }
  button.play { margin-top: 6px; padding: 12px 42px; font-size: 18px; font-weight: 800; border: none; border-radius: 999px; background: linear-gradient(135deg, #ffd166, #f77f00); color: #10141f; cursor: pointer; }
</style>
</head>
<body>
  <div class="hud">
    <div class="pill">⏱️ <b id="time">0</b>s</div>
    <div class="pill">💣 <b id="mines">10</b></div>
  </div>
  <div id="grid"></div>
  <button class="flagbtn" id="flagbtn">🚩 حالت پرچم: خاموش</button>
  <div class="hint">روی خانه کلیک کن؛ راست‌کلیک/لمس طولانی برای پرچم</div>

  <div id="overlay">
    <h2 id="oTitle">💣 تمام شد!</h2>
    <div class="score" id="oScore">0</div>
    <div class="board" id="boardTop"></div>
    <button class="play" id="replay">🔁 بازی دوباره</button>
  </div>

<script>
"use strict";
const KEY = "mines";
const N = 9, BOMBS = 10;
const gridEl = document.getElementById("grid");
let grid, revealed, flagSet, flagMode, seconds, timer, over, firstClick;

function reset() {
  grid = Array.from({ length: N }, () => Array(N).fill(0));
  revealed = Array.from({ length: N }, () => Array(N).fill(false));
  flagSet = new Set(); seconds = 0; over = false; firstClick = true;
  flagMode = false;
  document.getElementById("flagbtn").classList.remove("on");
  document.getElementById("flagbtn").textContent = "🚩 حالت پرچم: خاموش";
  clearInterval(timer);
  timer = setInterval(() => { if (!over) { seconds++; document.getElementById("time").textContent = seconds; } }, 1000);
  document.getElementById("mines").textContent = BOMBS;
  document.getElementById("overlay").classList.remove("show");
  render();
}

function placeBombs(safeR, safeC) {
  let placed = 0;
  while (placed < BOMBS) {
    const r = Math.floor(Math.random() * N), c = Math.floor(Math.random() * N);
    if (grid[r][c] === -1 || (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1)) continue;
    grid[r][c] = -1; placed++;
  }
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (grid[r][c] === -1) continue;
    let n = 0;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nc >= 0 && nr < N && nc < N && grid[nr][nc] === -1) n++;
    }
    grid[r][c] = n;
  }
}

function render() {
  gridEl.innerHTML = "";
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const d = document.createElement("div");
    d.className = "cell";
    if (revealed[r][c]) {
      d.classList.add("open");
      if (grid[r][c] === -1) { d.classList.add("bomb"); d.textContent = "💣"; }
      else if (grid[r][c] > 0) { d.classList.add("n" + grid[r][c]); d.textContent = grid[r][c]; }
    } else if (flagSet.has(r * N + c)) {
      d.classList.add("flag"); d.textContent = "🚩";
    }
    d.addEventListener("click", () => onCell(r, c));
    d.addEventListener("contextmenu", e => { e.preventDefault(); toggleFlag(r, c); });
    d.addEventListener("pointerdown", e => { if (e.pointerType === "touch") longPress.start(d, r, c); });
    d.addEventListener("pointerup", () => longPress.cancel());
    d.addEventListener("pointerleave", () => longPress.cancel());
    gridEl.appendChild(d);
  }
}

const longPress = {
  t: null, start(d, r, c) { this.cancel(); this.t = setTimeout(() => toggleFlag(r, c), 450); },
  cancel() { clearTimeout(this.t); },
};

function toggleFlag(r, c) {
  if (over || revealed[r][c]) return;
  const k = r * N + c;
  if (flagSet.has(k)) flagSet.delete(k); else flagSet.add(k);
  document.getElementById("mines").textContent = BOMBS - flagSet.size;
  render();
}

function onCell(r, c) {
  if (over || revealed[r][c]) return;
  if (flagSet.has(r * N + c)) return;
  if (flagMode) return toggleFlag(r, c);
  if (firstClick) { firstClick = false; placeBombs(r, c); }
  reveal(r, c);
  checkWin();
}

function reveal(r, c) {
  if (r < 0 || c < 0 || r >= N || c >= N || revealed[r][c]) return;
  revealed[r][c] = true;
  if (grid[r][c] === -1) { lose(); return; }
  if (grid[r][c] === 0) {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) reveal(r + dr, c + dc);
  }
}

function checkWin() {
  let cleared = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (revealed[r][c]) cleared++;
  if (cleared === N * N - BOMBS) win();
}

let clearedCount = () => revealed.flat().filter(Boolean).length;

async function endGame(title, score) {
  over = true; clearInterval(timer);
  document.getElementById("oTitle").textContent = title;
  document.getElementById("oScore").textContent = score;
  GameSDK.saveLocalBest(KEY, score);
  const res = await GameSDK.submit(KEY, score);
  const top = res.top || [];
  const el = document.getElementById("boardTop");
  if (top.length) {
    el.innerHTML = "<div class='row' style='color:#8b97ad'><span>رتبه</span><span>بازیکن</span><span>امتیاز</span></div>" +
      top.map(t => `<div class="row${String(t.id) === String(GameSDK.userId) ? " me" : ""}"><span>${t.rank}.</span><span>${(t.name || "کاربر")}</span><span>${t.score}</span></div>`).join("");
  } else el.innerHTML = "<div class='row' style='justify-content:center;color:#8b97ad'>برد ثبت نشد</div>";
  document.getElementById("overlay").classList.add("show");
}

function lose() {
  if (over) return;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c] === -1) revealed[r][c] = true;
  render();
  endGame("💥 مین! باختی!", Math.max(0, clearedCount() * 2));
}

function win() {
  render();
  const score = Math.max(10, 1000 - seconds * 5 + clearedCount() * 2);
  endGame("🏆 بردی! همه مین‌ها پیدا شد!", score);
}

document.getElementById("replay").addEventListener("click", reset);
document.getElementById("flagbtn").addEventListener("click", () => {
  flagMode = !flagMode;
  document.getElementById("flagbtn").classList.toggle("on", flagMode);
  document.getElementById("flagbtn").textContent = "🚩 حالت پرچم: " + (flagMode ? "روشن" : "خاموش");
});
GameSDK.expand();
reset();
</script>
</body>
</html>
